name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: unzip algouda-flutter-source.zip -d source
      - run: flutter pub get
        working-directory: source/algouda_flutter
      - run: flutter build apk --release
        working-directory: source/algouda_flutter
      - uses: actions/upload-artifact@v4
        with:
          name: algouda-android-apk
          path: source/algouda_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
